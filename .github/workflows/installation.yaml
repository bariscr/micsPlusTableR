name: Installation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installation:
    name: Install and reinstall (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install XQuartz on macOS
        if: runner.os == 'macOS'
        run: |
          # CRAN's gdtools binary needs the X11 libraries supplied by XQuartz.
          brew install --cask xquartz
          test -f /opt/X11/lib/libXrender.1.dylib
      - name: Set up R
        id: setup-r
        continue-on-error: true
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      # The external R-hub version resolver can fail temporarily on every OS.
      # Retry once; a second failure must still fail the installation job.
      - name: Retry R setup
        if: steps.setup-r.outcome == 'failure'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::remotes
      - name: Check clean installation and replacement in fresh R processes
        run: Rscript tools/test-installation.R
